function renderCalendar(){let items=dayitems(selected),errors=overlap(items);let html=`<div class="weather">🌤 <b>參考預報（11/12 快照，非即時）</b>：${wx[selected]}<br><span class="muted">日本天氣預報會變動，請以當日官方預報為準。</span></div>`;if(view==='day'){html+=`<div class="timeline-list timelinepreview" id="timeline-list"><div class="timeline-dates muted">${dateOf(selected)} · Asia/Tokyo</div><div class="timeline-intro muted">按「編輯」調整，已預約時段預設鎖定</div><div class="timeline-cards">`;for(let x of items){html+=`<div class="timeline-time-row"><div class="time">${x.time}</div><article class="timeline-card" style="border-left-color:${C[x.type]}" tabindex="0" data-id="${x.id}"><strong>${escapeHTML(x.name)}</strong> ${x.locked?'<span class="locked">🔒 已預約</span>':''}<small>${escapeHTML(x.type)} · ${x.duration} 分鐘 · ${x.cost===null?'費用待估':'¥'+money(x.cost)+'／'+x.costUnit}</small>${x.note?`<small>${escapeHTML(x.note)}</small>`:''}${errors.has(x.id)?'<div class="warn">⚠ 時段重疊，請確認交通與時間</div>':''}<div class="actions"><button class="tiny edit" data-id="${x.id}">編輯</button><button class="tiny del" data-id="${x.id}">刪除</button></div></article></div>`}html+='</div></div>'}else{html+='<div class="weekgrid">'+Array.from({length:8},(_,i)=>`<div class="weekcol"><h4>11/${14+i}</h4>${dayitems(i).map(x=>`<div class="weekitem" data-id="${x.id}" style="border-color:${C[x.type]}" title="雙擊編輯">${x.time}<br>${escapeHTML(x.name)}${x.locked?' 🔒':''}</div>`).join('')}</div>`).join('')+'</div>'}if(!items.length&&view==='day')html+='<p>當天尚無行程，點「新增」開始。</p>';$('calendar').innerHTML=html}
function renderMap(){let items=dayitems(selected).filter(x=>x.type!=='住宿'||true);let query=items.find(x=>x.type==='景點')?.name||areas[selected];$('mapbox').innerHTML=`<iframe title="${escapeHTML(areas[selected])}地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(query+', Japan')}&output=embed"></iframe>`;$('mapnote').innerHTML=`目前顯示 ${escapeHTML(query)} 附近。<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(query+', Japan')}">在 Google 地圖開啟 ↗</a><br>實際道路線形與即時交通未串接，路段僅供規劃參考。`}
function renderRoutes(){let a=dayitems(selected);$('routes').innerHTML=a.length<2?'尚無相鄰路段':a.slice(1).map((x,i)=>`<div class="expenseitem"><span>🚗 ${escapeHTML(a[i].name)} → ${escapeHTML(x.name)}</span><span class="muted">車程／費用待確認</span></div>`).join('')}
function renderExpenses(){let list=[...state.items.filter(x=>x.cost!==null).map(x=>({id:x.id,name:x.name,type:x.type,amount:x.cost,unit:x.costUnit,fromItem:true})),...state.expenses];let total=list.reduce((s,x)=>s+Number(x.amount||0)*(x.unit==='每人'?3:1),0);$('yen').textContent='¥'+money(total);$('twd').textContent='NT$'+money(total*state.rate);$('rate').value=state.rate;$('expenselist').innerHTML=list.map(x=>`<div class="expenseitem"><span>${escapeHTML(x.name)} <small>${escapeHTML(x.type)}／${escapeHTML(x.unit)}</small></span><span>¥${money(x.amount)} ${!x.fromItem?`<button class="tiny removeexp" data-id="${x.id}">刪除</button>`:''}</span></div>`).join('')||'<p>尚無已填費用，所有未估項目均保留空白。</p>';let sums=Object.keys(C).map(k=>list.filter(x=>x.type===k).reduce((s,x)=>s+Number(x.amount||0)*(x.unit==='每人'?3:1),0));let start=0,grad=sums.map((v,i)=>{let from=start;start+=total?v/total*100:0;return `${Object.values(C)[i]} ${from}% ${start}%`}).join(',');$('donut').style.background=total?`conic-gradient(${grad})`:'#eee'}
function renderPacking(){let done=state.packing.filter(x=>x.done).length;$('packprogress').textContent=`${done}/${state.packing.length}（${state.packing.length?Math.round(done/state.packing.length*100):0}%）`;let search=$('packsearch').value.toLowerCase(),only=$('incomplete').checked;let groups=[...new Set(state.packing.map(x=>x.group))],colors=['#f6d27a','#a8d3e6','#f2a497','#b9daa5','#ded2ed','#f4c7aa'];$('packlist').innerHTML=groups.map((g,i)=>{let items=state.packing.filter(x=>x.group===g&&(!only||!x.done)&&x.name.toLowerCase().includes(search));return items.length?`<div class="packinggroup"><h3 style="background:${colors[i%6]}">${escapeHTML(g)}</h3>${items.map(x=>`<label><input type="checkbox" class="packcheck" data-id="${x.id}" ${x.done?'checked':''}><span style="flex:1;${x.done?'text-decoration:line-through':''}">${escapeHTML(x.name)} × ${x.qty}</span><button class="tiny delpack" data-id="${x.id}">刪除</button></label>`).join('')}</div>`:''}).join('')||'沒有符合條件的用品'}
function openEdit(id){let x=state.items.find(y=>y.id===id)||{id:'',date:dateOf(selected),time:'12:00',duration:60,type:'景點',name:'',address:'',cost:null,costUnit:'全團',note:'',locked:false};$('editheading').textContent=id?'編輯行程':'新增行程';let f=$('editform');for(let k of ['id','date','time','duration','type','name','address','costUnit','note'])f.elements[k].value=x[k]??'';f.elements.cost.value=x.cost??'';f.elements.locked.checked=x.locked;$('editor').showModal()}
function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function ics(){let esc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let dt=(x,delta)=>{let [y,m,d]=x.date.split('-').map(Number),[hh,mm]=x.time.split(':').map(Number);let t=new Date(Date.UTC(y,m-1,d,hh,mm+delta));return t.toISOString().replace(/[-:]/g,'').slice(0,15)};let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SHIN TRIP//ZH-TW','CALSCALE:GREGORIAN','X-WR-TIMEZONE:Asia/Tokyo'];for(let x of state.items){lines.push('BEGIN:VEVENT',`UID:${x.id}@shin-trip.local`,`DTSTART;TZID=Asia/Tokyo:${dt(x,0)}`,`DTEND;TZID=Asia/Tokyo:${dt(x,Number(x.duration))}`,`SUMMARY:${esc(x.name)}`,`DESCRIPTION:${esc(x.note)}`,`LOCATION:${esc(x.address)}`,'END:VEVENT')}lines.push('END:VCALENDAR');return lines.join('\r\n')}
$('editdate').innerHTML=Array.from({length:8},(_,i)=>`<option value="${dateOf(i)}">${dateOf(i)}</option>`).join('');
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.day!==undefined){selected=Number(t.dataset.day);render()}else if(t.dataset.tab){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b===t));['plan','expenses','packing'].forEach(id=>$(id).classList.toggle('hidden',id!==t.dataset.tab))}else if(t.id==='dayview'||t.id==='weekview'){view=t.id==='dayview'?'day':'week';render()}else if(t.id==='additem'){openEdit()}else if(t.classList.contains('edit')){openEdit(t.dataset.id)}else if(t.classList.contains('del')){let x=state.items.find(y=>y.id===t.dataset.id);if(x.locked&&!confirm('這是已預約行程，確定刪除嗎？'))return;if(!confirm('確定刪除此行程？'))return;snap();state.items=state.items.filter(y=>y.id!==x.id);save();render()}else if(t.id==='undo'){if(!history.length)return toast('沒有可復原的變更');state=JSON.parse(history.pop());save();render();toast('已復原')}else if(t.id==='moneytoggle'){showMoney=!showMoney;render()}else if(t.id==='cancel'){$('editor').close()}else if(t.id==='fab'){let open=$('floatmenu').classList.toggle('open');t.setAttribute('aria-expanded',String(open))}else if(t.id==='exportjson'){download(JSON.stringify({schema:'shin-trip-v1',timezone:'Asia/Tokyo',...state},null,2),'京阪神芯之旅.json','application/json');$('floatmenu').classList.remove('open')}else if(t.id==='importjson'){$('fileinput').click()}else if(t.id==='exportics'){download(ics(),'京阪神芯之旅.ics','text/calendar;charset=utf-8');$('floatmenu').classList.remove('open')}else if(t.id==='reset'){if(confirm('清除所有編輯並還原初始行程？')){snap();state={items:structuredClone(baseItems),expenses:[],packing:structuredClone(initialPacking),rate:0.21};save();render()}}else if(t.id==='addexpense'){let name=prompt('費用名稱');if(!name)return;let amount=prompt('日圓金額');if(amount===null||amount===''||isNaN(Number(amount))||Number(amount)<0)return toast('請輸入有效金額');snap();state.expenses.push({id:uid(),name,type:'其他',amount:Number(amount),unit:'全團'});save();render()}else if(t.classList.contains('removeexp')){snap();state.expenses=state.expenses.filter(x=>x.id!==t.dataset.id);save();render()}else if(t.id==='addpack'){let name=prompt('用品名稱');if(!name)return;snap();state.packing.push({id:uid(),name,group:'其他',qty:1,done:false,note:''});save();render()}else if(t.classList.contains('delpack')){snap();state.packing=state.packing.filter(x=>x.id!==t.dataset.id);save();render()}else if(t.id==='previewroute'||t.id==='fit'){let a=dayitems(selected).map(x=>x.name);let url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a.at(-1)+', Japan')+'&waypoints='+encodeURIComponent(a.slice(0,-1).join('|'));window.open(url,'_blank','noopener')}});
document.addEventListener('dblclick',e=>{let c=e.target.closest('[data-id].weekitem,[data-id].timeline-card');if(c)openEdit(c.dataset.id)});
$('editform').addEventListener('submit',e=>{e.preventDefault();let f=e.currentTarget,fd=new FormData(f),x=Object.fromEntries(fd.entries());x.locked=f.elements.locked.checked;x.duration=Number(x.duration);x.cost=x.cost===''?null:Number(x.cost);let old=state.items.find(a=>a.id===x.id);if(old?.locked&&(old.time!==x.time||old.date!==x.date)&&!confirm('這是已預約的鎖定時段，確定修改日期或時間？'))return;snap();if(old)state.items=state.items.map(a=>a.id===x.id?x:a);else{x.id=uid();state.items.push(x)}selected=Math.max(0,Math.min(7,Math.round((new Date(x.date+'T00:00:00Z')-new Date(START+'T00:00:00Z'))/86400000)));save();$('editor').close();render();toast('已儲存到本機草稿')});
$('fileinput').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.items)||!Array.isArray(data.packing)||!Array.isArray(data.expenses))throw Error('資料格式不符');snap();state={items:data.items,packing:data.packing,expenses:data.expenses,rate:Number(data.rate)||0.21};save();render();toast('已匯入 JSON')}catch(err){toast('匯入失敗：'+err.message)}e.target.value=''});
$('rate').addEventListener('change',e=>{snap();state.rate=Number(e.target.value)||0;save();renderExpenses()});$('packsearch').addEventListener('input',renderPacking);$('incomplete').addEventListener('change',renderPacking);document.addEventListener('change',e=>{if(e.target.classList.contains('packcheck')){snap();let p=state.packing.find(x=>x.id===e.target.dataset.id);p.done=e.target.checked;save();renderPacking()}});render();
</script></body></html>
